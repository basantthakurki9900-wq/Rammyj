  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const SUITS = ["♠", "♥", "♦", "♣"];
    const SUIT_COLOR = { "♠": "#1c1c1c", "♣": "#1c1c1c", "♥": "#dc2626", "♦": "#dc2626" };
    const RANK_LABEL = { 11: "J", 12: "Q", 13: "K", 14: "A" };
    
    const UPI_ID = "royalcasino@upi";

    // ============= ZapUPI Global Setup =============
    window.handleZapSuccess = null;
    window.handleZapFailed = null;
    window.handleZapTimeout = null;

    if (typeof ZapUPI !== 'undefined') {
      ZapUPI.setPaymentCallbacks({
        onSuccess: function(orderId) {
          if (window.handleZapSuccess) {
            window.handleZapSuccess(orderId);
          } else {
            alert("Payment Successful! Order: " + orderId);
          }
        },
        onFailed: function(orderId) {
          if (window.handleZapFailed) {
            window.handleZapFailed(orderId);
          } else {
            alert("Payment Failed. Order: " + orderId);
          }
        },
        onTimeout: function(orderId) {
          if (window.handleZapTimeout) {
            window.handleZapTimeout(orderId);
          } else {
            alert("Payment Timed Out. Order: " + orderId);
          }
        }
      });
    }

    // ============= Colorful Toast System =============
    function showColorfulToast(msg, type = 'info', duration = 3000) {
      const colors = {
        success: { bg: '#065f46', border: '#34d399', icon: '✅' },
        error: { bg: '#7f1d1d', border: '#f87171', icon: '❌' },
        warning: { bg: '#713f12', border: '#fbbf24', icon: '⚠️' },
        info: { bg: '#1e3a5f', border: '#60a5fa', icon: 'ℹ️' },
        deposit: { bg: '#4c1d95', border: '#a78bfa', icon: '💰' },
        win: { bg: '#065f46', border: '#34d399', icon: '🎉' },
        lose: { bg: '#7f1d1d', border: '#f87171', icon: '💔' }
      };
      const style = colors[type] || colors.info;
      
      const toastDiv = document.createElement('div');
      toastDiv.className = 'fixed inset-0 z-[200] flex items-center justify-center pointer-events-none';
      toastDiv.innerHTML = `
        <div class="bg-[${style.bg}] border-2 border-[${style.border}] px-8 py-6 rounded-2xl shadow-2xl flex flex-col items-center toast-pop max-w-[90%] pointer-events-auto" style="background: ${style.bg}; border-color: ${style.border};">
          <div class="text-6xl mb-3">${style.icon}</div>
          <div class="text-white font-bold text-base text-center">${msg}</div>
        </div>
      `;
      document.body.appendChild(toastDiv);
      setTimeout(() => {
        toastDiv.style.opacity = '0';
        toastDiv.style.transition = 'opacity 0.5s';
        setTimeout(() => toastDiv.remove(), 500);
      }, duration);
    }

    // ============= Device ID Check =============
    function getDeviceId() {
      try {
        let deviceId = localStorage.getItem('tp_device_id');
        if (!deviceId) {
          deviceId = 'DEV_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
          localStorage.setItem('tp_device_id', deviceId);
        }
        return deviceId;
      } catch(e) { return 'DEV_' + Date.now(); }
    }

    // ============= BOT NAMES =============
    const BOT_NAMES = [
      "Ravi", "Priya", "Amit", "Neha", "Vikram", "Pooja", "Arjun", "Sneha",
      "Raj", "Anjali", "Karan", "Meera", "Deepak", "Ritu", "Suresh", "Kavya",
      "Mohan", "Lata", "Rakesh", "Geeta", "Sanjay", "Sunita", "Vivek", "Anita",
      "Rahul", "Shreya", "Ajay", "Kiran", "Pankaj", "Divya", "Manish", "Sonal"
    ];
    const BOT_AVATARS = ["👨", "👩", "🧔", "👴", "👵", "👨‍🦱", "👩‍🦰", "🧑‍🦳"];
    
    function getBotNames(count = 3) {
      let shuffled = [...BOT_NAMES];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled.slice(0, count);
    }
    function getBotAvatar() { return BOT_AVATARS[Math.floor(Math.random() * BOT_AVATARS.length)]; }
    
    const safeParse = (str, fallback) => { try { return JSON.parse(str) || fallback; } catch(e) { return fallback; } };
    const getUsers = () => safeParse(localStorage.getItem('tp_users'), {});
    const getConfig = () => {
      const saved = safeParse(localStorage.getItem('tp_config'), {});
      return {
        telegramLink: "https://t.me/royalcasino",
        whatsappLink: "https://wa.me/919999999999",
        minWithdraw: 100,
        promoCodes: [],
        bankList: ["SBI", "HDFC", "ICICI", "Axis", "Other"],
        fakeOnline: 50,
        fakePlaying: 10,
        depositAmounts: [100, 200, 500, 1000],
        broadcastMsg: "",
        ...saved
      };
    };
    const saveUserToDB = (id, userData) => { 
      const users = getUsers(); 
      users[id] = { ...users[id], ...userData }; 
      localStorage.setItem('tp_users', JSON.stringify(users)); 
      if(window.db) window.db.ref('tp_users/' + id).update(userData); 
    };
    const genId = () => 'TP' + Math.floor(100000 + Math.random() * 900000);
    const genRef = (name) => (name.substring(0, 3).toUpperCase() + Math.floor(1000 + Math.random() * 9000));

    // ============= CENTRALIZED ZAPUPI PAYMENT FUNCTION WITH STRICT ORDER STATUS API =============
    window.zapPollInterval = null; // ग्लोबल टाइमर वेरिएबल

    function processZapUPIPayment(amount, user, onSuccess, onError) {
      if (!amount || amount <= 0) {
        showColorfulToast('कृपया एक वैध राशि चुनें', 'warning');
        return;
      }

      // पुराना टाइमर बंद करें अगर चल रहा है
      if (window.zapPollInterval) {
        clearInterval(window.zapPollInterval);
        window.zapPollInterval = null;
      }

      const currentOrderId = "ORD" + Date.now();

      // 1. ZapUPI के SDK कॉलबैक्स (जब यूज़र ऐप के अंदर ही पेमेंट करता है)
      window.handleZapSuccess = (orderId) => {
        if (window.zapPollInterval) clearInterval(window.zapPollInterval);
        window.zapPollInterval = null;
        onSuccess(orderId);
      };

      window.handleZapFailed = (orderId) => {
        if (window.zapPollInterval) clearInterval(window.zapPollInterval);
        window.zapPollInterval = null;
        showColorfulToast('पेमेंट विफल रहा। कृपया पुनः प्रयास करें।', 'error');
        onError(orderId);
      };

      window.handleZapTimeout = (orderId) => {
        showColorfulToast('समय समाप्त, स्टेटस चेक कर रहे हैं...', 'warning');
        // टाइमआउट पर पोलिंग बंद नहीं करेंगे, क्योंकि यूज़र ने पेमेंट किया हो सकता है
      };

      // 2. Order Status API से लगातार चेक करने वाला फंक्शन (Polling)
      const checkOrderStatus = async () => {
        try {
          const response = await fetch('https://pay.zapupi.com/api/order-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              zap_key: "zap8c0d6927e12791628e9e4f545dc3f0e2",
              order_id: currentOrderId
            })
          });
          const data = await response.json();
          
          // स्ट्रिक्ट चेक: हम सिर्फ payment_status या txn_status चेक करेंगे, status को नहीं
          // क्योंकि "Order Created" का status भी success होता है, जिससे गलती हो रही थी
          let payStatus = '';
          if (data) {
            payStatus = (data.payment_status || data.txn_status || (data.data && (data.data.payment_status || data.data.status)) || '').toString().toLowerCase();
          }
          
          // अगर पेमेंट वाकई सफल हुआ है
          if (payStatus === 'success' || payStatus === 'paid' || payStatus === 'captured') {
            if (window.zapPollInterval) clearInterval(window.zapPollInterval);
            window.zapPollInterval = null;
            showColorfulToast("पेमेंट सफल! बैलेंस अपडेट हो रहा है...", 'success');
            onSuccess(currentOrderId);
          } 
          // अगर पेमेंट फेल हुआ है
          else if (payStatus === 'failed' || payStatus === 'cancelled' || payStatus === 'expired') {
            if (window.zapPollInterval) clearInterval(window.zapPollInterval);
            window.zapPollInterval = null;
            showColorfulToast('पेमेंट विफल रहा।', 'error');
            onError(currentOrderId);
          }
          // अगर 'pending' है तो कुछ नहीं करेंगे, टाइमर चालू रहेगा
        } catch (e) {
          console.error("Status polling error:", e);
        }
      };

      // हर 5 सेकंड (5000ms) में स्टेटस चेक करने का टाइमर शुरू करें
      window.zapPollInterval = setInterval(checkOrderStatus, 5000);

      // 3. पेमेंट पेज ऐप के अंदर खोलने का कोड
      ZapUPI.createOrder(
        {
          zap_key: "zap8c0d6927e12791628e9e4f545dc3f0e2",
          order_id: currentOrderId,
          amount: amount.toString(),
          remark: user.name + " | " + user.id
        },
        {
          onResponse: function(paymentUrl, orderId, data) {
            if (paymentUrl) {
              // यह लाइन पेमेंट पेज को ऐप के अंदर ही खोलती है
              ZapUPI.loadPayment(paymentUrl);
            } else {
              showColorfulToast("पेमेंट URL प्राप्त नहीं हुआ।", 'error');
              if (window.zapPollInterval) clearInterval(window.zapPollInterval);
              window.zapPollInterval = null;
              onError("No URL");
            }
          },
          onError: function(err) {
            showColorfulToast("पेमेंट गेटवे में समस्या: " + err, 'error');
            if (window.zapPollInterval) clearInterval(window.zapPollInterval);
            window.zapPollInterval = null;
            onError(err);
          }
        }
      );
    }

    // ============= CARD GAME FUNCTIONS =============
    function buildDeck() { const deck = []; for (const s of SUITS) for (let r = 2; r <= 14; r++) deck.push({ rank: r, suit: s }); return deck; }
    function shuffle(deck) { const d = [...deck]; for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; }
    function evaluateHand(cards) { 
      if (!cards || cards.length === 0) return { category: 0, tiebreak: [0], name: "कोई कार्ड नहीं" };
      const ranks = [...cards.map((c) => c.rank)].sort((a, b) => b - a); 
      const suits = cards.map((c) => c.suit); 
      const isFlush = suits[0] === suits[1] && suits[1] === suits[2]; 
      const isTrail = ranks[0] === ranks[1] && ranks[1] === ranks[2]; 
      let isSeq = ranks[0] - ranks[1] === 1 && ranks[1] - ranks[2] === 1; 
      let seqVal = ranks[0]; 
      if (!isSeq && ranks[0] === 14 && ranks[1] === 3 && ranks[2] === 2) { isSeq = true; seqVal = 3; } 
      const isPair = !isTrail && (ranks[0] === ranks[1] || ranks[1] === ranks[2]); 
      let pairRank = 0, kicker = 0;

    function compareHands(a, b) { const ea = evaluateHand(a), eb = evaluateHand(b); if (ea.category !== eb.category) return ea.category - eb.category; const len = Math.max(ea.tiebreak.length, eb.tiebreak.length); for (let i = 0; i < len; i++) { const av = ea.tiebreak[i] ?? 0, bv = eb.tiebreak[i] ?? 0; if (av !== bv) return av - bv; } return 0; }

    function shouldGiveAAA(gamesPlayed) {

      let chance = 0;
      if (gamesPlayed >= 5 && gamesPlayed < 8) chance = 0.10;
      else if (gamesPlayed >= 8 && gamesPlayed < 11) chance = 0.15;
      else if (gamesPlayed >= 11 && gamesPlayed < 14) chance = 0.20;
      else if (gamesPlayed >= 14 && gamesPlayed < 17) chance = 0.25;

      chance = Math.min(Math.max(chance + randomFactor, 0.05), 0.40);
      return Math.random() < chance;
    }

    function getAAAHand(numPlayers) {
      let deck = shuffle(buildDeck());
      let hands = [];
      hands[0] = [{ rank: 14, suit: "♠" }, { rank: 14, suit: "♥" }, { rank: 14, suit: "♦" }];

        [{ rank: 8, suit: "♥" }, { rank: 9, suit: "♦" }, { rank: 10, suit: "♣" }],

    function getNormalDeck(numPlayers, userBalance, gamesPlayed) {

      else if (userBalance > 100) winChance = 0.40;
      else if (userBalance > 50) winChance = 0.50;
      else winChance = 0.60;
      
      const gamesSinceLastWin = gamesPlayed % 20;
      if (gamesSinceLastWin > 12) winChance = Math.min(winChance + 0.3, 0.90);

      winChance = Math.min(Math.max(winChance + randomFactor, 0.05), 0.95);

      let bestIdx = 0;

        hands[bestIdx] = temp;
      } else if (!userWins && bestIdx === 0) {
        let botIdx = Math.floor(Math.random() * (numPlayers - 1)) + 1;
        let temp = hands[0];
        hands[0] = hands[botIdx];
        hands[botIdx] = temp;
      }
      return { deck: hands.flat(), userWins, userHandStrength, isAAA: false };
    }

    function startRound(game, userBalance, gamesPlayed, isDepositBonus = false, forceHardLoss = false) {
      const numPlayers = game.players.length;
      const botNames = getBotNames(3);
      let botIndex = 0;
      const playersWithNewNames = game.players.map((p, i) => {

    function doPack(game) {

    function doChaal(game, isRaise) { const cur = game.turn; const p = game.players[cur]; const base = requiredAmount(p, game.stake); const amt = isRaise ? base * 2 : base; if (amt > p.chips && !p.isBot) return doPack(game); const finalAmt = Math.min(amt, p.chips); const players = game.players.map((p2, i) => (i === cur ? { ...p2, chips: p2.chips - finalAmt } : p2)); const pot = game.pot + finalAmt; const canRaise = game.raises < 6; const stake = isRaise && canRaise ? game.stake * 2 : game.stake; const raises = isRaise && canRaise ? game.raises + 1 : game.raises; let g = mark({ ...game, players, pot, stake, raises }, `${p.name} ने चाल खेली (${finalAmt})।`, { type: "chip", idx: cur, amount: finalAmt }); const ended = checkRoundEnd(g); if (ended) return ended; return { ...g, turn: nextActiveIndex(players, cur) }; }

    function applyBotTurn(game, userBalance, userHandStrength, isAAA) {
      if (game.phase !== "playing") return game;
      const cur = game.turn;
      const p = game.players[cur];

    function botDecide(game, userBalance, userHandStrength, isAAA) {
      const cur = game.turn;
      const p = game.players[cur];
      const active = activeList(game.players);
      let decisionSeen = p.seen || true;
      const hand = evaluateHand(p.hand);
      
      const botMoveCount = game.botMoveCount || 0;
      const human = game.players[0];
      const humanFolded = human.folded || human.out;

      if (humanFolded) {
        if (active.length > 2) {
          if (botMoveCount >= 2) return { seen: true, action: "pack" };
          return { seen: decisionSeen, action: "chaal" };
        } else if (active.length === 2) {
          return { seen: true, action: "show" };
        }
      }

      if (p.isBot && active.length === 2) {
        if (botMoveCount >= 1) return { seen: true, action: "show" };
        return { seen: decisionSeen, action: "chaal" };
      }
      
      if (isAAA && p.isBot) return botDecideForAAA(game, userBalance, p.id);
      
      const userHasStrongHand = userHandStrength >= 4;
      const userHasVeryStrongHand = userHandStrength >= 5;
      
      if (userHasVeryStrongHand && active.length === 2) {
        if (Math.random() < 0.75) return { seen: true, action: "show" };
      }
      if (userHasStrongHand && userBalance > 100) {
        if (Math.random() < 0.45) return { seen: true, action: "chaal" };
      }
      
      if (userBalance > 250) {
        if (hand.category <= 1 && game.stake >= game.bootAmount * 2 && Math.random() < 0.8) return { seen: decisionSeen, action: "pack" };
        if (hand.category === 2 && Math.random() < 0.5) return { seen: decisionSeen, action: "pack" };
        if (active.length === 2 && game.raises >= 1 && hand.category >= 3) return { seen: decisionSeen, action: "show" };
        if (Math.random() < 0.4) return { seen: decisionSeen, action: "raise" };
      } else if (userBalance > 150) {
        if (hand.category <= 1 && game.stake >= game.bootAmount * 3 && Math.random() < 0.6) return { seen: decisionSeen, action: "pack" };
        if (hand.category === 2 && Math.random() < 0.3) return { seen: decisionSeen, action: "pack" };
        if (active.length === 2 && game.raises >= 2 && hand.category >= 3) return { seen: decisionSeen, action: "show" };
      } else if (userBalance > 100) {
        if (hand.category <= 1 && game.stake >= game.bootAmount * 3 && Math.random() < 0.5) return { seen: decisionSeen, action: "pack" };
        if (hand.category === 2 && Math.random() < 0.2) return { seen: decisionSeen, action: "pack" };
        if (active.length === 2 && game.raises >= 2 && hand.category >= 3) return { seen: decisionSeen, action: "show" };
      } else {
        if (hand.category <= 1 && Math.random() < 0.3) return { seen: decisionSeen, action: "pack" };
        if (active.length === 2 && game.raises >= 3 && hand.category >= 2) return { seen: decisionSeen, action: "show" };
      }
      
      const prevIdx = prevActiveIndex(game.players, cur);
      const prevP = game.players[prevIdx];
      if (isAAA && p.isBot) return { seen: true, action: "chaal" };
      if (active.length > 2 && p.seen && prevP.seen && prevP.isBot && Math.random() < 0.15) return { seen: decisionSeen, action: "sideshow" };
      
      return { seen: decisionSeen, action: "chaal" };
    }

    function botDecideForAAA(game, userBalance, botId) {
      const cur = game.turn;
      const p = game.players[cur];
      const active = activeList(game.players);
      if (botId === 'bot1') return { seen: true, action: "pack" };
      if (botId === 'bot2' || botId === 'bot3') {

        if (human.folded || human.out) return { seen: true, action: "show" };

      }
      return { seen: true, action: "chaal" };
    }

        { bottom: "120px", left: "10px", flexDirection: "row" }, 
        { top: "60px", left: "10px", flexDirection: "row" }, 
        { top: "60px", right: "10px", flexDirection: "row-reverse" }, 
        { bottom: "120px", right: "10px", flexDirection: "row-reverse" } 
      ];

      const isHumanTurn = game.phase === "playing" && game.players[game.turn]?.id === user.id && !human.folded && !human.out; 
      const activeCount = activeList(game.players).length;
      const humansTurnReq = isHumanTurn ? requiredAmount(human, game.stake) : 0; 
      const canPay = humansTurnReq <= human.chips;
      const canSideShow = isHumanTurn && human.seen && activeCount > 2 && game.players[prevActiveIndex(game.players, game.turn)]?.seen && canPay; 
      const canShow = isHumanTurn && activeCount === 2 && canPay; 
      const canChaal = isHumanTurn && canPay;
      const tableChips = []; const colors = ['chip-red', 'chip-blue', 'chip-green', 'chip-gold']; const numChips = Math.min(20, Math.floor(game.pot / bootAmount));
      for(let i=0; i<numChips; i++) { const angle = (i / numChips) * 2 * Math.PI + (i*0.3); const radius = 30 + (i % 4) * 15; const x = Math.cos(angle) * radius; const y = Math.sin(angle) * radius; tableChips.push({ x, y, color: colors[i % 4], val: bootAmount, id: i }); }
      
      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      };

      if (!game || !game.players || game.players.length === 0) {
        return (
          <div className="app-wrapper table-grad text-white flex flex-col items-center justify-center">
            <div className="text-xl font-bold mb-4 text-center px-4">गेम लोड हो रहा है...</div>
          </div>
        );
      }

      return (
        <div className="app-wrapper table-grad text-white relative">
          <div className="casino-table"></div>
          
          {showDepositOverlay && (
            <div className="deposit-overlay">
              <div className="text-center max-w-sm w-full">
                <div className="text-6xl mb-4">⚠️</div>
                <h2 className="text-2xl font-bold text-yellow-400 mb-2">
                  {user.balance >= 250 && !user.hasDepositedAfter250 ? '₹250+ बैलेंस! डिपॉजिट अनिवार्य' : (user.balance <= 0 ? '💰 बैलेंस खत्म!' : '⚠️ पैसे नहीं हैं!')}
                </h2>
                <p className="text-gray-300 text-sm mb-4">
                  {user.balance >= 250 && !user.hasDepositedAfter250 
                    ? 'आपका बैलेंस ₹250 से ज्यादा हो गया है। कृपया ₹100 डिपॉजिट करें तभी आप गेम खेल सकते हैं।'
                    : 'आपके पास चाल चलने के लिए पर्याप्त पैसे नहीं हैं। कृपया डिपॉजिट करें।'}
                </p>
                
                <div className="flex justify-center mb-6">
                  <div className="timer-ring">
                    <div className="inner"></div>
                    <span>{formatTime(depositTimer)}</span>
                  </div>
                </div>
                
                <div className="text-sm text-gray-400 mb-2">डिपॉजिट राशि चुनें:</div>
                <div className="grid grid-cols-3 gap-2 mb-4">
                  {quickAmounts.slice(0, 6).map(amt => (
                    <button 
                      key={amt} 
                      onClick={() => setSelectedDepositAmount(amt)}
                      className={`deposit-amount-btn ${selectedDepositAmount === amt ? 'selected' : ''}`}
                    >
                      ₹{amt}
                    </button>
                  ))}
                </div>
                
                <button 
                  onClick={handleDeposit} 
                  disabled={processingPayment}
                  className="w-full py-3 rounded-xl font-bold text-lg btn-deposit flex justify-center items-center gap-2 disabled:opacity-50"
                >
                  {processingPayment ? (
                    <>
                      <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                      </svg>
                      प्रोसेसिंग...
                    </>
                  ) : (
                    `💰 ₹${selectedDepositAmount} डिपॉजिट करें`
                  )}
                </button>
                
                <button 
                  onClick={() => {
                    setShowDepositOverlay(false);
                    setIsTimerRunning(false);
                    if (timerIntervalRef.current) {
                      clearInterval(timerIntervalRef.current);
                      timerIntervalRef.current = null;
                    }
                    handleExit();
                  }}
                  className="mt-4 text-gray-400 text-sm underline hover:text-white transition-colors"
                >
                  🚪 गेम छोड़ें (Exit)
                </button>
              </div>
            </div>
          )}
          
          <div className="flex justify-between items-center px-4 py-3 absolute top-0 left-0 right-0 z-20 bg-black/30 backdrop-blur-sm">
            <button onClick={() => {
              if (showDepositOverlay) {
                setShowDepositOverlay(false);
                setIsTimerRunning(false);
                if (timerIntervalRef.current) {
                  clearInterval(timerIntervalRef.current);
                  timerIntervalRef.current = null;
                }
              }
              handleExit();
            }} className="px-3 py-1.5 rounded-lg text-xs font-bold bg-white/10 border border-white/20 active:scale-95">← बाहर</button>
            <div className="text-sm font-bold text-yellow-400">बूट: ₹{game.bootAmount}</div>
          </div>
          <div className="flex-grow relative w-full h-full">
            {game.players && game.players.map((p, i) => {
              const isHumanPod = p.id === user.id;
              return (
                <PlayerPod 
                  key={p.id || i} 
                  player={p} 
                  isTurn={game.turn === i && game.phase === "playing"} 
                  showHand={game.phase === "roundEnd" && !p.folded && !p.out} 
                  position={positions[i] || positions[0]} 
                  podRef={(el) => (podRefs.current[i] = el)} 
                  isHuman={isHumanPod} 
                  timer={isHumanPod ? timer : null} 
                />
              );
            })}
            <div ref={potRef} className="absolute left-1/2 top-[35%] -translate-x-1/2 -translate-y-1/2 z-10 flex flex-col items-center gap-1 w-full">
              <div className="relative w-full h-[150px] flex items-center justify-center">
                {tableChips.map((chip) => ( <div key={chip.id} className={`table-chip ${chip.color}`} style={{ transform: `translate(${chip.x}px, ${chip.y}px)`, animationDelay: `${chip.id * 0.03}s` }}>₹{chip.val}</div> ))}
                <div className="pot-glow px-4 py-1.5 rounded-full font-mono font-bold text-lg text-yellow-400 bg-black/80 border border-yellow-500/50 shadow-lg backdrop-blur-sm absolute z-10">₹ {game.pot ? game.pot.toLocaleString("en-IN") : '0'}</div>
              </div>
              {game.phase === "roundEnd" && game.winnerInfo && game.players && game.players[game.winnerInfo.idx] && (<div className="mt-2 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 animate-bounce bg-yellow-400 text-[#1e293b]">👑 {game.players[game.winnerInfo.idx].name} WINNER</div>)}
              {game.isAAA && (
                <div className="aaa-badge mt-1">
                  🔥 AAA - तीन इक्के!
                </div>
              )}
            </div>
            {chipFlies.map((cf) => (<ChipFlyItem key={cf.id} {...cf} onDone={() => setChipFlies((prev) => prev.filter((x) => x.id !== cf.id))} />))}
          </div>
          <div className="w-full px-4 py-1 h-8 flex items-center justify-center text-xs text-center absolute bottom-24 left-0 right-0 pointer-events-none z-10 text-gray-300">{game.log && game.log.slice(-1).map((l, i) => <div key={i} className="bg-black/60 px-3 py-1 rounded-full">{l}</div>)}</div>
          <div className="w-full bg-black/80 backdrop-blur-md border-t border-yellow-900/50 px-3 pt-3 pb-6 min-h-[90px] z-20 absolute bottom-0 rounded-t-2xl shadow-2xl">
            <div className="flex flex-wrap gap-2 justify-center items-center max-w-md mx-auto"> 
              {isHumanTurn ? ( 
                <React.Fragment> 
                  {!human.seen && <button onClick={() => updateGame(g => doSee(g))} className="px-4 py-2.5 rounded-xl font-bold text-xs bg-blue-600 text-white shadow active:scale-95">👁 देखें</button>} 
                  <button onClick={() => updateGame(g => doPack(g))} className="px-4 py-2.5 rounded-xl font-bold text-xs btn-red shadow">❌ Pack</button> 
                  {canSideShow && <button onClick={() => updateGame(g => doSideShow(g))} className="px-4 py-2.5 rounded-xl font-bold text-xs bg-orange-600 text-white shadow active:scale-95">🤝 Side Show</button>} 
                  {canChaal ? (<button onClick={() => updateGame(g => doChaal(g, false))} className="px-4 py-2.5 rounded-xl font-bold text-xs btn-green shadow">चाल (₹{humansTurnReq})</button>) : (<div className="px-4 py-2.5 rounded-xl font-bold text-xs bg-gray-700 text-gray-400 shadow">चाल (₹{humansTurnReq})</div>)} 
                  {canChaal && (humansTurnReq * 2 <= human.chips) && game.raises < 6 && game.stake < 100 && (<button onClick={() => updateGame(g => doChaal(g, true))} className="px-4 py-2.5 rounded-xl font-bold text-xs bg-purple-700 text-white shadow active:scale-95">📈 रेज़ (₹{humansTurnReq * 2})</button>)} 
                  {canShow && <button onClick={() => updateGame(g => doShow(g))} className="px-4 py-2.5 rounded-xl font-bold text-xs bg-red-900 text-white shadow active:scale-95">⚔️ Show</button>} 
                  {!canPay && <div className="w-full text-red-400 text-[10px] font-bold text-center">पैसे नहीं हैं! ⏳</div>} 
                </React.Fragment> 
              ) : ( game.phase !== "gameover" && <div className="text-gray-400 text-sm flex items-center gap-2"><div className="w-3 h-3 border-2 border-yellow-400 border-t-transparent rounded-full animate-spin"></div> प्रतीक्षा करें...</div> )} 
            </div> 
          </div>
        </div>
      );
    }

    // ============= MINES GAME =============
    function MinesGame({ user, onExit, onUpdateUser }) {
      const [betAmount, setBetAmount] = useState(10); 
      const [grid, setGrid] = useState(Array(25).fill(null).map(() => ({ state: 'hidden', isBomb: false }))); 
      const [isPlaying, setIsPlaying] = useState(false); 
      const [currentMultiplier, setCurrentMultiplier] = useState(1.0); 
      const [message, setMessage] = useState("बेट अमाउंट चुनें और खेलना शुरू करें"); 
      const clickStats = useRef(safeParse(localStorage.getItem('mines_clicks'), {}));
      const [showDepositOverlay, setShowDepositOverlay] = useState(false);
      const [selectedDepositAmount, setSelectedDepositAmount] = useState(100);
      const [processingPayment, setProcessingPayment] = useState(false);
      
      useEffect(() => {
        if (user.balance <= 0) {
          setShowDepositOverlay(true);
          setMessage("💰 बैलेंस खत्म! कृपया डिपॉजिट करें।");
        } else {
          setShowDepositOverlay(false);
          setMessage("बेट अमाउंट चुनें और खेलना शुरू करें");
        }
      }, [user.balance]);

      const determineMinesOutcome = useCallback((currentUser) => { 
        let consecutiveWins = currentUser.minesConsecutiveWins || 0; 
        let recentLosses = currentUser.recentLosses || 0; 

        if (consecutiveWins < 2) return 'win_small';
        if (recentLosses >= 3) return 'win_small';
        
        if (Math.random() < 0.30) return 'win_small';
        return 'lose';
      }, []);
      
      const generateGrid = (outcome) => { 
        let newGrid = Array(25).fill(null).map(() => ({ state: 'hidden', isBomb: false })); 
        let bombs = new Set(); 
        const corners = [0, 4, 20, 24]; 
        corners.forEach(c => bombs.add(c)); 
        if (outcome === 'lose') { 
          const sortedClicks = Object.entries(clickStats.current).sort((a, b) => b[1] - a[1]); 
          sortedClicks.forEach(([idx, count]) => { 
            if (bombs.size < 8) bombs.add(parseInt(idx)); 
          }); 
          while (bombs.size < 8) { 
            let randIdx = Math.floor(Math.random() * 25); 
            bombs.add(randIdx); 
          } 
        } else { 
          while (bombs.size < 6) { 
            let randIdx = Math.floor(Math.random() * 25); 
            if (!corners.includes(randIdx)) bombs.add(randIdx); 
          } 
        } 
        bombs.forEach(idx => newGrid[idx].isBomb = true); 
        return newGrid; 
      };
      
      const startGame = () => { 
        if (user.balance < betAmount) { 
          showColorfulToast("पर्याप्त बैलेंस नहीं है", 'warning');
          return; 
        }
        const outcome = determineMinesOutcome(user); 
        const newGrid = generateGrid(outcome); 
        setGrid(newGrid); 
        setIsPlaying(true); 
        setCurrentMultiplier(1.0); 
        setMessage("बॉक्स खोलें! (10% बोनस प्रति बॉक्स)"); 
        let newBalance = user.balance - betAmount; 
        let newWd = user.withdrawableBalance || 0; 
        if (newWd > newBalance) newWd = newBalance; 
        if (newWd < 0) newWd = 0; 
        onUpdateUser({ balance: newBalance, withdrawableBalance: newWd }); 
      };
      
      const handleBoxClick = (idx) => { 
        if (!isPlaying || grid[idx].state !== 'hidden') return; 
        clickStats.current[idx] = (clickStats.current[idx] || 0) + 1; 
        localStorage.setItem('mines_clicks', JSON.stringify(clickStats.current)); 
        const newGrid = [...grid]; 
        newGrid[idx] = { ...newGrid[idx], state: 'revealed' }; 
        setGrid(newGrid); 
        if (newGrid[idx].isBomb) { 
          setMessage("💣 बम फटा! आप हार गए।"); 
          setIsPlaying(false); 
          const history = Array.isArray(user.gameHistory) ? user.gameHistory : [];
          history.push({ result: 'Loss', amount: betAmount, time: new Date().toLocaleTimeString(), type: 'mines' });
          onUpdateUser({ 
            recentLosses: (user.recentLosses || 0) + 1, 
            losses: (user.losses || 0) + 1, 
            minesConsecutiveWins: 0, 
            gamesPlayed: (user.gamesPlayed || 0) + 1,
            gameHistory: history.slice(-50)
          }); 
          showColorfulToast("💣 बम फटा! आप हार गए।", 'error');
          setTimeout(() => { 
            setGrid(g => g.map(box => ({ ...box, state: 'revealed' }))); 
          }, 500); 
        } else { 
          const newMult = parseFloat((currentMultiplier * 1.1).toFixed(2)); 
          setCurrentMultiplier(newMult); 
          const potentialWin = Math.floor(betAmount * newMult); 
          setMessage(`💰 +10% बोनस! अगर अब कैश करें तो ₹${potentialWin} मिलेंगे।`); 
          if (!newGrid.some(box => box.state === 'hidden' && !box.isBomb)) { 
            handleCashout(newMult); 
          } 
        } 
      };
      
      const handleCashout = (mult = currentMultiplier) => { 
        if (!isPlaying) return; 
        const winAmount = Math.floor(betAmount * mult); 
        setMessage(`🎉 कैशआउट सफल! आपने ₹${winAmount} जीते।`); 
        setIsPlaying(false); 
        
        const withdrawableAmount = Math.floor(winAmount * 0.05);
        const bonusAmount = winAmount - withdrawableAmount;
        
        let newBalance = user.balance + winAmount; 
        let newWd = (user.withdrawableBalance || 0) + withdrawableAmount; 
        let newBonus = (user.bonusBalance || 0) + bonusAmount;
        
        if (newWd > newBalance) newWd = newBalance; 
        if (newWd < 0) newWd = 0; 
        
        const history = Array.isArray(user.gameHistory) ? user.gameHistory : [];
        history.push({ result: 'Win', amount: winAmount, time: new Date().toLocaleTimeString(), type: 'mines' });
        
        onUpdateUser({ 
          balance: newBalance, 
          withdrawableBalance: newWd,
          bonusBalance: newBonus,
          wins: (user.wins || 0) + 1, 
          recentLosses: 0, 
          sessionWinnings: (user.sessionWinnings || 0) + winAmount, 
          minesConsecutiveWins: (user.minesConsecutiveWins || 0) + 1, 
          gamesPlayed: (user.gamesPlayed || 0) + 1,
          gameHistory: history.slice(-50)
        }); 
        showColorfulToast(`🎉 ₹${winAmount} जीते! (5% विड्रॉल योग्य)`, 'win');
        setGrid(g => g.map(box => ({ ...box, state: 'revealed' }))); 
      };
      
      const handleDepositFromMines = () => {
        setProcessingPayment(true);

        processZapUPIPayment(selectedDepositAmount, user, 
          (orderId) => {
            const newTx = {
                amount: selectedDepositAmount,
                time: new Date().toLocaleString(),
                ts: Date.now(),
                status: "Success",
                utr: orderId,
                desc: 'ZapUPI Deposit'
            };
            const newHistory = [...(Array.isArray(user.depositHistory) ? user.depositHistory : []), newTx];

            let updatedData = { depositHistory: newHistory.slice(-20) };
            updatedData.balance = (user.balance || 0) + selectedDepositAmount;
            if (selectedDepositAmount >= 100) updatedData.hasDepositedAfter250 = true;

            onUpdateUser(updatedData);

            showColorfulToast(`डिपॉजिट सफल! ✅ ₹${selectedDepositAmount} जोड़ दिए गए।`, 'success');
            setProcessingPayment(false);
            setShowDepositOverlay(false);
          },
          (err) => {
            setProcessingPayment(false);
          }
        );
      };

      return (
        <div className="app-wrapper bg-slate-900 text-white p-4 flex flex-col">
          {showDepositOverlay && (
            <div className="deposit-overlay">
              <div className="text-center max-w-sm w-full">
                <div className="text-6xl mb-4">💰</div>
                <h2 className="text-2xl font-bold text-yellow-400 mb-2">
                  {user.balance <= 0 ? 'बैलेंस खत्म!' : '₹100 डिपॉजिट करें'}
                </h2>
                <p className="text-gray-300 text-sm mb-4">
                  गेम खेलने के लिए कृपया पैसे डिपॉजिट करें।
                </p>
                <div className="grid grid-cols-2 gap-2 mb-4">
                  {[100, 200, 500, 1000].map(amt => (
                    <button 
                      key={amt} 
                      onClick={() => setSelectedDepositAmount(amt)}
                      className={`deposit-amount-btn ${selectedDepositAmount === amt ? 'selected' : ''}`}
                    >
                      ₹{amt}
                    </button>
                  ))}
                </div>
                <button 
                  onClick={handleDepositFromMines}
                  disabled={processingPayment}
                  className="w-full py-3 rounded-xl font-bold text-lg btn-deposit flex justify-center items-center gap-2 disabled:opacity-50"
                >
                  {processingPayment ? (
                    <>
                      <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                      </svg>
                      प्रोसेसिंग...
                    </>
                  ) : (
                    `💰 ₹${selectedDepositAmount} डिपॉजिट करें`
                  )}
                </button>
                <button 
                  onClick={() => { setShowDepositOverlay(false); onExit(); }} 
                  className="mt-4 text-gray-400 text-sm underline hover:text-white transition-colors"
                >
                  🚪 बाहर जाएं
                </button>
              </div>
            </div>
          )}
          
          <div className="flex justify-between items-center mb-6"><button onClick={onExit} className="mr-4 text-yellow-400 text-2xl">←</button><h2 className="text-xl font-bold text-yellow-400">Mines (25 डब्बे)</h2><div className="font-bold text-green-400 text-sm">₹{user.balance}</div></div>
          <div className="bg-slate-800 p-6 rounded-2xl mb-6 text-center border border-white/10 shadow-xl"><div className="text-sm text-gray-400">वर्तमान मल्टीप्लायर</div><div className="text-5xl font-bold text-yellow-400 mt-2 mb-2 drop-shadow-lg">{currentMultiplier.toFixed(2)}x</div><div className="text-[12px] text-gray-500 mt-2 bg-slate-900 py-1.5 rounded-lg">{message}</div></div>
          <div className="grid grid-cols-4 gap-2 mb-6">{[10, 20, 50, 100].map(amt => (<button key={amt} onClick={() => setBetAmount(amt)} disabled={isPlaying} className={`py-3 rounded-xl text-sm border font-bold transition-transform ${betAmount === amt ? 'bg-yellow-500 text-slate-900 border-yellow-400 scale-105 shadow-lg' : 'bg-slate-800 border-white/10 text-white active:scale-95'}`}>₹{amt}</button>))}</div>
          {!isPlaying ? (
            <button onClick={startGame} disabled={user.balance < betAmount} className="w-full py-4 rounded-xl font-bold text-lg btn-green mb-8 disabled:opacity-50">
              {user.balance <= 0 ? '⛔ बैलेंस खत्म' : user.balance < betAmount ? '⛔ पर्याप्त बैलेंस नहीं' : '▶️ खेल शुरू करें (₹' + betAmount + ')'}
            </button>
          ) : (<button onClick={() => handleCashout()} disabled={currentMultiplier <= 1.0} className="w-full py-4 rounded-xl font-bold text-lg btn-primary mb-8 disabled:opacity-50">💵 कैशआउट (₹{Math.floor(betAmount * currentMultiplier)})</button>)}
          <div className="grid grid-cols-5 gap-2 flex-grow">{grid.map((box, i) => (<button key={i} onClick={() => handleBoxClick(i)} disabled={box.state !== 'hidden' || !isPlaying} className={`mine-box aspect-square rounded-2xl flex items-center justify-center text-2xl font-bold border-2 ${box.state === 'hidden' ? 'bg-slate-800 border-white/10' : (box.isBomb ? 'bg-red-900/80 border-red-500' : 'bg-green-900/80 border-green-500')}`}>{box.state === 'hidden' ? '❓' : (box.isBomb ? '💣' : '💎')}</button>))}</div>
        </div>
      );
    }

    // ============= AUTH SCREEN =============
    function AuthScreen({ onSignup }) {
      const [name, setName] = useState(''); const [mobile, setMobile] = useState(''); const [pass, setPass] = useState(''); const [isLogin, setIsLogin] = useState(true); const [refCode, setRefCode] = useState('');
      const [isBlocked, setIsBlocked] = useState(false);
      
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const ref = params.get('ref');
          if (ref) setRefCode(ref.toUpperCase());
        } catch(e) {}
      }, []);

      const handleAuth = async () => {        
        if (isLogin) {
          if (!mobile || !pass) return showColorfulToast("मोबाइल और पासवर्ड दर्ज करें", 'warning');
          const users = getUsers();
          let foundUser = Object.values(users).find(u => u.mobile === mobile && u.password === pass);
          
          if (!foundUser && window.db) {

    // ============= WALLET SCREEN =============
    function WalletScreen({ user, onBack, onUpdate }) {
      const [amount, setAmount] = useState(''); 
      const [tab, setTab] = useState('deposit'); 
      const [historyTab, setHistoryTab] = useState('deposit'); 
      const [bankDetails, setBankDetails] = useState(user.bankDetails || { bankName: '', accName: '', accNumber: '', ifsc: '' }); 
      const [promoInput, setPromoInput] = useState(''); 
      const [toast, setToast] = useState(null); 
      const [processingPayment, setProcessingPayment] = useState(false);
      
      const config = getConfig(); 
      const banks = config.bankList || ["SBI", "HDFC", "ICICI", "Axis", "Other"]; 
      const quickAmounts = (config.depositAmounts && config.depositAmounts.length > 0) ? config.depositAmounts : [100, 200, 500, 1000];
      
      const totalDeposits = (user.depositHistory || []).reduce((sum, d) => {
        if (d.status === 'Success' && d.desc !== 'Signup Bonus' && d.desc !== 'Promo Code') return sum + (parseInt(d.amount) || 0);
        return sum;
      }, 0);
      
      const gamesPlayed = user.gamesPlayed || 0;
      const canWithdraw = totalDeposits >= 100 && gamesPlayed > 0;

      const showToastLocal = (msg) => { setToast({ msg }); setTimeout(() => setToast(null), 2500); };

      const handleDeposit = () => {
        const amt = parseInt(amount);
        if (!amt || amt <= 0) return showColorfulToast('कृपया राशि चुनें', 'warning');
        setProcessingPayment(true);

        processZapUPIPayment(amt, user, 
          (orderId) => {
            const newTx = {
                amount: amt,
                time: new Date().toLocaleString(),
                ts: Date.now(),
                status: "Success",
                utr: orderId,
                desc: 'ZapUPI Deposit'
            };
            const newHistory = [...(Array.isArray(user.depositHistory) ? user.depositHistory : []), newTx];

            let updatedData = { depositHistory: newHistory.slice(-20) };
            updatedData.balance = (user.balance || 0) + amt;
            if (amt >= 100) updatedData.hasDepositedAfter250 = true;

            onUpdate(updatedData);

            showColorfulToast(`डिपॉजिट सफल! ✅ ₹${amt} जोड़ दिए गए।`, 'success');
            setProcessingPayment(false);
          },
          (err) => {
            setProcessingPayment(false);
          }
        );
      };

      const handleSaveBank = () => { 
        if (!bankDetails.bankName || !bankDetails.accName || !bankDetails.accNumber || !bankDetails.ifsc) 
          return showColorfulToast("कृपया सभी बैंक विवरण भरें", 'warning'); 
        onUpdate({ bankDetails }); 
        showColorfulToast("बैंक डिटेल्स अपडेट हो गई!", 'success'); 
      };
      
      const handleWithdraw = () => { 
        if (!canWithdraw) return showColorfulToast("विड्रॉल के लिए पहले कम से कम ₹100 का डिपॉजिट करें और कम से कम 1 गेम खेलें!", 'warning'); 
        if (user.isBlocked) return showColorfulToast("आपका अकाउंट ब्लॉक है, विड्रॉल नहीं हो सकता।", 'error'); 
        const amt = parseInt(amount); 
        if (!amt || amt <= 0) return showColorfulToast('वैध राशि दर्ज करें', 'warning'); 
        if (amt < config.minWithdraw) return showColorfulToast(`न्यूनतम विड्रॉल लिमिट ₹${config.minWithdraw} है।`, 'warning'); 
        let maxWd = Math.min(user.withdrawableBalance || 0, user.balance || 0); 
        if (amt > maxWd) return showColorfulToast(`पर्याप्त विड्रॉल बैलेंस नहीं है। आप केवल ₹${maxWd} ही विड्रॉल कर सकते हैं।`, 'error'); 
        const newTx = { txId: Date.now(), amount: amt, time: new Date().toLocaleString(), ts: Date.now(), status: "Pending" }; 
        const newHistory = [...(Array.isArray(user.withdrawHistory) ? user.withdrawHistory : []), newTx]; 
        let newBalance = user.balance - amt; let newWd = (user.withdrawableBalance || 0) - amt; if (newWd < 0) newWd = 0; 
        onUpdate({ balance: newBalance, withdrawableBalance: newWd, withdrawHistory: newHistory.slice(-20) }); 
        showColorfulToast(`₹${amt} का विड्रॉल अनुरोध सफल! ✅`, 'success'); 
        setAmount(''); 
      };
      
      const handleApplyPromo = () => { 
        const code = promoInput.toUpperCase(); 
        const promo = (config.promoCodes || []).find(p => p.code === code && p.isActive); 
        if (!promo) return showColorfulToast("अमान्य या समाप्त प्रोमो कोड।", 'error'); 
        if (user.usedPromos?.includes(code)) return showColorfulToast("आपने इस प्रोमो कोड का उपयोग पहले कर लिया है।", 'warning'); 
        const promoAmount = parseInt(promo.amount) || 0; 
        const newBalance = user.balance + promoAmount; 
        const newUsedPromos = [...(Array.isArray(user.usedPromos) ? user.usedPromos : []), code]; 
        const newDepoHistory = [...(Array.isArray(user.depositHistory) ? user.depositHistory : []), { amount: promoAmount, time: new Date().toLocaleString(), desc: 'Promo Code', status: 'Success' }]; 
        onUpdate({ balance: newBalance, usedPromos: newUsedPromos, depositHistory: newDepoHistory.slice(-20) }); 
        showColorfulToast(`₹${promoAmount} सफलतापूर्वक आपके अकाउंट में जोड़ दए गए हैं! 🎉`, 'success'); 
        setPromoInput(''); 
      };
      
      return (
        <div className="app-wrapper bg-slate-900 text-white p-4 flex flex-col deposit-container">
          {toast && ( <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 pointer-events-none"><div className="bg-slate-800 border-2 border-green-500 px-8 py-6 rounded-2xl shadow-2xl flex flex-col items-center toast-pop max-w-[90%]"><div className="text-6xl text-green-500 mb-3">✅</div><div className="text-white font-bold text-base text-center">{toast.msg}</div></div></div> )}
          
          <div className="flex items-center mb-6">
            <button onClick={onBack} className="mr-4 text-yellow-400 text-2xl">←</button>
            <h2 className="text-xl font-bold">मेरा वॉलेट</h2>
          </div>
          
          <div className="bg-slate-800 p-6 rounded-2xl mb-6 text-center border border-white/10 shadow-xl">
            <div className="text-gray-400 text-sm">कुल बैलेंस</div>
            <div className="text-4xl font-bold text-green-500 mt-2">₹ {user.balance.toLocaleString('en-IN')}</div>
          </div>
          
          <div className="flex gap-2 mb-4 bg-slate-800 p-1 rounded-xl">
            <button onClick={() => setTab('deposit')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${tab === 'deposit' ? 'bg-green-700 text-white' : 'text-gray-400'}`}>डिपॉजिट</button>
            <button onClick={() => setTab('withdraw')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${tab === 'withdraw' ? 'bg-red-700 text-white' : 'text-gray-400'}`}>विड्रॉल</button>
          </div>
          
          {tab === 'deposit' ? (
            <React.Fragment>
              <div className="amount-grid">
                {quickAmounts.map(a => (
                  <button 
                    key={a} 
                    onClick={() => setAmount(a.toString())} 
                    className={`py-3 rounded-lg text-sm border font-bold transition-colors ${amount === a.toString() ? 'bg-yellow-500 text-slate-900 border-yellow-400 scale-105 shadow-lg' : 'bg-slate-800 border-white/10 text-white active:scale-95'}`}
                  >
                    ₹{a}
                  </button>
                ))}
              </div>

              <button 
                onClick={handleDeposit} 
                disabled={!amount || processingPayment} 
                className="w-full py-3 rounded-xl font-bold text-lg btn-deposit mt-4 mb-4 disabled:opacity-50 flex justify-center items-center gap-2"
              >
                {processingPayment ? (
                  <>
                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    प्रोसेसिंग...
                  </>
                ) : (
                  `💰 ₹${amount || 0} डिपॉजिट करें`
                )}
              </button>

              <div className="bg-slate-800 p-4 rounded-xl mt-2 mb-8 border border-white/10">
                <h3 className="font-bold text-yellow-400 mb-2 text-sm">🎁 प्रोमो कोड रिडीम करें</h3>
                <div className="flex gap-2">
                  <input 
                    type="text" 
                    placeholder="प्रोमो कोड दर्ज करें" 
                    value={promoInput} 
                    onChange={(e) => setPromoInput(e.target.value)} 
                    className="flex-1 px-4 py-2 rounded-lg bg-slate-900 border border-white/10 text-white outline-none uppercase" 
                  />
                  <button onClick={handleApplyPromo} className="bg-purple-600 text-white px-4 py-2 rounded-lg font-bold">लागू करें</button>
                </div>
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="bg-slate-800 p-3 rounded-xl mb-4 text-center border border-yellow-500/30">
                <div className="text-xs text-gray-400">विड्रॉल बैलेंस</div>
                <div className="text-2xl font-bold text-yellow-400">₹{Math.min((user.withdrawableBalance || 0), (user.balance || 0)).toLocaleString('en-IN')}</div>
              </div>
              
              {!canWithdraw && (
                <div className="bg-red-900/40 border border-red-500/50 text-red-400 p-3 rounded-lg mb-4 text-center font-bold text-sm">
                  ⚠️ विड्रॉल के लिए पहले कम से कम ₹100 का डिपॉजिट करें और कम से कम 1 गेम खेलें। <br/>(आपका कुल असली डिपॉजिट: ₹{totalDeposits}, गेम खेले: {gamesPlayed})
                </div>
              )}
              {user.isBlocked && <div className="bg-red-900/50 text-red-400 p-3 rounded-lg mb-4 text-center font-bold">आपका अकाउंट ब्लॉक है। विड्रॉल करने के लिए एडमिन से संपर्क करें।</div>}
              
              <div className="text-xs text-gray-400 mb-2 text-center">न्यूनतम विड्रॉल लिमिट: ₹{config.minWithdraw}</div>
              
              <div className="space-y-3 mb-4 bg-slate-800 p-4 rounded-xl border border-white/10">
                <h3 className="font-bold text-yellow-400 mb-2">बैंक डिटेल्स {user.bankDetails ? 'अपडेट' : 'सेव'} करें</h3>
                <select value={bankDetails.bankName} onChange={(e) => setBankDetails({...bankDetails, bankName: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-white/10 text-white outline-none">
                  <option value="">बैंक चुनें</option>
                  {banks.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
                <input type="text" placeholder="अकाउंट होल्डर का नाम" value={bankDetails.accName} onChange={(e) => setBankDetails({...bankDetails, accName: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-white/10 text-white outline-none" />
                <input type="number" placeholder="बैंक अकाउंट नंबर" value={bankDetails.accNumber} onChange={(e) => setBankDetails({...bankDetails, accNumber: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-white/10 text-white outline-none" />
                <input type="text" placeholder="IFSC कोड" value={bankDetails.ifsc} onChange={(e) => setBankDetails({...bankDetails, ifsc: e.target.value.toUpperCase()})} className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-white/10 text-white outline-none" />
                <button onClick={handleSaveBank} className="w-full py-2 rounded-lg bg-blue-600 font-bold mt-2">बैंक डिटेल्स सेव करें</button>
              </div>
              
              {user.bankDetails && <div className="bg-slate-800 p-4 rounded-xl mb-4 border border-white/10 text-sm">
                <input type="number" placeholder="विड्रॉल राशि" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full px-4 py-3 mt-2 rounded-xl bg-slate-900 border border-white/10 text-white outline-none" />
                <button onClick={handleWithdraw} disabled={user.isBlocked || !canWithdraw} className="w-full py-3 rounded-xl font-bold text-lg btn-red mt-4 disabled:opacity-50 disabled:cursor-not-allowed">💸 विड्रॉल करें</button>
              </div>}
            </React.Fragment>
          )}
          
          <div className="mt-4 flex-grow">
            <div className="flex gap-2 mb-3 bg-slate-800 p-1 rounded-xl">
              <button onClick={() => setHistoryTab('deposit')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${historyTab === 'deposit' ? 'bg-green-700 text-white' : 'text-gray-400'}`}>डिपॉजिट हिस्ट्री</button>
              <button onClick={() => setHistoryTab('withdraw')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${historyTab === 'withdraw' ? 'bg-red-700 text-white' : 'text-gray-400'}`}>विड्रॉल हिस्ट्री</button>
            </div>
            
            <div className="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
              {historyTab === 'deposit' ? (
                (user.depositHistory || []).slice().reverse().map((tx, i) => (
                  <div key={i} className="bg-slate-800 p-3 rounded-xl flex justify-between items-center text-sm border border-white/5 shadow-sm">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full flex items-center justify-center text-lg bg-green-900/40 text-green-400 border border-green-500/30">💰</div>
                      <div>
                        <div className="font-bold text-white text-sm">{tx.desc || 'डिपॉजिट'}</div>
                        <div className="text-[10px] text-gray-400">{tx.time}</div>
                        {tx.utr && <div className="text-[8px] text-gray-500">ID: {tx.utr}</div>}
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="font-bold text-green-500">+ ₹{tx.amount}</div>
                      <div className="text-[10px] font-semibold mt-1 text-green-600">✅ सफल</div>
                    </div>
                  </div>
                ))
              ) : (
                (user.withdrawHistory || []).slice().reverse().map((tx, i) => (
                  <div key={i} className="bg-slate-800 p-3 rounded-xl flex justify-between items-center text-sm border border-white/5 shadow-sm">
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-full flex items-center justify-center text-lg border ${tx.status === 'Approved' ? 'bg-green-900/40 text-green-400 border-green-500/30' : tx.status === 'Rejected' ? 'bg-red-900/40 text-red-400 border-red-500/30' : 'bg-yellow-900/40 text-yellow-400 border-yellow-500/30'}`}>
                        {tx.status === 'Approved' ? '✅' : tx.status === 'Rejected' ? '❌' : '⏳'}
                      </div>
                      <div><div className="font-bold text-white text-sm">विड्रॉल रिक्वेस्ट</div><div className="text-[10px] text-gray-400">{tx.time}</div></div>
                    </div>
                    <div className="text-right"><div className="font-bold text-white">- ₹{tx.amount}</div><div className={`text-[10px] font-semibold mt-1 ${tx.status === 'Approved' ? 'text-green-400' : tx.status === 'Rejected' ? 'text-red-400' : 'text-yellow-400'}`}>{tx.status === 'Approved' ? 'सफल' : tx.status === 'Rejected' ? 'अस्वीकृत' : 'लंबित'}</div></div>
                  </div>
                ))
              )}
              {historyTab === 'deposit' && (!user.depositHistory || user.depositHistory.length === 0) && <div className="text-gray-500 text-sm text-center py-4">कोई डिपॉजिट नहीं मिला</div>}
              {historyTab === 'withdraw' && (!user.withdrawHistory || user.withdrawHistory.length === 0) && <div className="text-gray-500 text-sm text-center py-4">कोई विड्रॉल नहीं मिला</div>}
            </div>
          </div>
        </div>
      );
    }

    // ============= APP =============
    function App() {
      const [screen, setScreen] = useState('login'); const [user, setUser] = useState(null); const [stakeAmount, setStakeAmount] = useState(10);
      const configRef = useRef(getConfig());
      
      useEffect(() => {
        if(window.db) {
          window.db.ref('tp_config').on('value', (snap) => { 
            if(snap.val()) {
              const mergedConfig = { ...getConfig(), ...snap.val() };
              localStorage.setItem('tp_config', JSON.stringify(mergedConfig));
              configRef.current = mergedConfig;
            }
          });
          
          const saved = localStorage.getItem('tp_logged_in');
          if (saved) {
            const u = safeParse(saved, null);
            if (u && u.id && u.mobile) {
              const userRef = window.db.ref('tp_users/' + u.id);
              userRef.on('value', (snap) => {
                const updatedU = snap.val();
                if (updatedU && updatedU.mobile && updatedU.name && typeof updatedU.balance !== 'undefined') {
                  if (JSON.stringify(updatedU) !== JSON.stringify(u)) {
                    localStorage.setItem('tp_logged_in', JSON.stringify(updatedU));
                    const allUsers = getUsers();
                    allUsers[updatedU.id] = updatedU;
                    localStorage.setItem('tp_users', JSON.stringify(allUsers));
                    setUser(updatedU);
                    if (updatedU.isBlocked && !u.isBlocked) { showColorfulToast("🚫 यह गलत है - आपका अकाउंट ब्लॉक है!", 'error'); }
                  }
                } else if (updatedU === null) {
                  localStorage.removeItem('tp_logged_in');
                  setUser(null);
                  setScreen('login');
                  showColorfulToast("आपका अकाउंट हटा दिया गया है। कृपया दोबारा लॉगिन करें।", 'error');
                }
              });
            }
          }
        }
      }, []);
      
      useEffect(() => { 
        const saved = localStorage.getItem('tp_logged_in'); 
        if (saved) { 
          const u = safeParse(saved, null);
          if (u && u.id && u.mobile) {
            setUser(u);
            setScreen('dashboard');
            if (window.db) {
              window.db.ref('tp_users/' + u.id).update({ isOnline: true });
            }
          }
        } 
      }, []);
      
      useEffect(() => {
        const handleBeforeUnload = () => { if(user && window.db) window.db.ref('tp_users/' + user.id).update({ isOnline: false, isPlaying: false }); };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [user]);

      const handleSignup = (newUser) => { setUser(newUser); setScreen('dashboard'); if(window.db) window.db.ref('tp_users/' + newUser.id).update({ isOnline: true }); };
      const handleLogout = () => { localStorage.removeItem('tp_logged_in'); if(user && window.db) window.db.ref('tp_users/' + user.id).update({ isOnline: false, isPlaying: false }); setUser(null); setScreen('login'); };
      
      const updateUser = useCallback((updates) => {
        setUser(prevUser => {
          if (!prevUser) return prevUser;
          const updatedUser = { ...prevUser, ...updates };
          localStorage.setItem('tp_logged_in', JSON.stringify(updatedUser));
          const allUsers = getUsers();
          allUsers[updatedUser.id] = updatedUser;
          localStorage.setItem('tp_users', JSON.stringify(allUsers));
          if (window.db) window.db.ref('tp_users/' + updatedUser.id).update(updates); 
          return updatedUser;
        });
      }, []);
      
      if (!user || screen === 'login') return <AuthScreen onSignup={handleSignup} />;
      
      if (screen === 'dashboard') return <Dashboard user={user} onPlay={() => setScreen('select_stake')} setScreen={setScreen} />;
      if (screen === 'select_stake') return <StakeSelection user={user} onSelect={(amt) => { setStakeAmount(amt); try { Tone.start(); } catch(e){} setScreen('game'); }} onBack={() => setScreen('dashboard')} />;
      if (screen === 'game') return <GameTable key={`game_${stakeAmount}_${user.id}`} bootAmount={stakeAmount} user={user} onExit={() => setScreen('dashboard')} onUpdateUser={updateUser} />;
      if (screen === 'mines') return <MinesGame user={user} onExit={() => setScreen('dashboard')} onUpdateUser={updateUser} />;
      if (screen === 'wallet') return <WalletScreen user={user} onBack={() => setScreen('dashboard')} onUpdate={updateUser} />;
      if (screen === 'profile') return <ProfileScreen user={user} onBack={() => setScreen('dashboard')} onUpdate={updateUser} onLogout={handleLogout} />;
      if (screen === 'gameHistory') return <GameHistoryScreen user={user} onBack={() => setScreen('dashboard')} />;
      if (screen === 'referral') return <ReferralScreen user={user} onBack={() => setScreen('dashboard')} />;
      return null;
    }
    
    // ============= STAKE SELECTION =============
    function StakeSelection({ user, onSelect, onBack }) { 
      const options = [
        { val: 1, boot: 2, name: "बेगिनर", icon: "🥉", color: "from-amber-700 to-amber-900", border: "border-amber-500/30" },
        { val: 2, boot: 4, name: "रूकी", icon: "🥈", color: "from-slate-600 to-slate-800", border: "border-slate-400/30" },
        { val: 5, boot: 10, name: "प्रो", icon: "🥇", color: "from-yellow-600 to-yellow-800", border: "border-yellow-400/40" },
        { val: 10, boot: 20, name: "लीजेंड", icon: "💎", color: "from-purple-700 to-indigo-900", border: "border-purple-400/40" }
      ]; 
      
      if (user.balance <= 0) {
        return (
          <div className="app-wrapper bg-gradient-to-b from-slate-900 via-slate-950 to-black text-white flex flex-col items-center justify-center p-6">
            <div className="text-6xl mb-4">⚠️</div>
            <h2 className="text-2xl font-bold text-yellow-400 mb-2">बैलेंस खत्म!</h2>
            <p className="text-gray-400 text-sm text-center mb-6">
              आपका बैलेंस 0 हो गया है।<br/>
              गेम खेलने के लिए वॉलेट में जाकर डिपॉजिट करें।
            </p>
            <button onClick={onBack} className="px-6 py-2 rounded-lg btn-primary font-bold">वापस जाएं</button>
          </div>
        );
      }
      
      if (user.balance >= 250 && !user.hasDepositedAfter250) {
        return (
          <div className="app-wrapper bg-gradient-to-b from-slate-900 via-slate-950 to-black text-white flex flex-col items-center justify-center p-6">
            <div className="text-6xl mb-4">⚠️</div>
            <h2 className="text-2xl font-bold text-yellow-400 mb-2">₹250+ बैलेंस!</h2>
            <p className="text-gray-400 text-sm text-center mb-6">
              आपका बैलेंस ₹250 से ज्यादा हो गया है।<br/>
              गेम खेलने के लिए वॉलेट में जाकर ₹100 डिपॉजिट करें।
            </p>
            <button onClick={onBack} className="px-6 py-2 rounded-lg btn-primary font-bold">वापस जाएं</button>
          </div>
        );
      }
      
      return ( 
        <div className="app-wrapper bg-gradient-to-b from-slate-900 via-slate-950 to-black text-white flex flex-col items-center p-6 relative overflow-hidden">
          <div className="absolute top-4 left-4">
            <button onClick={onBack} className="text-yellow-400 text-xl flex items-center gap-1 font-bold"><span className="text-3xl">←</span> वापस</button>
          </div>
          <div className="absolute top-4 right-4 bg-slate-800 px-4 py-2 rounded-xl border border-green-500/30 flex items-center gap-2 shadow-lg">
            <span className="text-sm text-gray-400">बैलेंस:</span>
            <span className="text-green-500 font-mono font-bold text-lg">₹{user.balance}</span>
          </div>
          <div className="mt-20 mb-8 text-center">
            <h2 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-amber-600 tracking-wide">गेम बोर्ड चुनें</h2>
            <p className="text-gray-400 text-sm mt-2">अपने बजट के हिसाब से बूट अमाउंट सेलेक्ट करें</p>
          </div>
          <div className="grid grid-cols-2 gap-5 w-full max-w-md mb-6">
            {options.map(opt => { 
              const isDisabled = user.balance < opt.val; 
              return (
                <button key={opt.val} onClick={() => !isDisabled && onSelect(opt.val)} disabled={isDisabled} 
                  className={`p-6 rounded-3xl flex flex-col items-center justify-center gap-2 border ${opt.border} transition-all transform ${isDisabled ? 'opacity-40 cursor-not-allowed bg-slate-800' : `bg-gradient-to-br ${opt.color} active:scale-95 hover:shadow-2xl shadow-lg premium-card`}`}>
                  <div className="text-5xl mb-2 drop-shadow-lg">{opt.icon}</div>
                  <div className="font-extrabold text-xl tracking-wide">{opt.name}</div>
                  <div className="text-3xl font-bold text-white drop-shadow">₹{opt.val}</div>
                  <div className="mt-1 px-3 py-1 bg-black/30 rounded-full text-xs font-bold text-gray-200">बूट: ₹{opt.boot}</div>
                  {isDisabled && <span className="text-[10px] text-red-400 mt-2 font-bold">पर्याप्त बैलेंस नहीं</span>}
                </button>
              ); 
            })}
          </div>
          <div className="mt-auto text-center text-gray-500 text-[10px] pb-4">🛡️ फेयर प्ले गारंटीड • 24/7 सपोर्ट</div>
        </div> 
      ); 
    }
    
    // ============= PROFILE SCREEN =============
    function ProfileScreen({ user, onBack, onUpdate, onLogout }) { 
      const [name, setName] = useState(user.name); const [avatar, setAvatar] = useState(user.avatar); const [pass, setPass] = useState(user.password); 
      const avatars = ['🧑', '👩', '🧔', '👴', '👵', '👨‍🦱', '👩‍🦰']; 
      const handleSave = () => { onUpdate({ name, avatar, password: pass }); showColorfulToast('प्रोफाइल अपडेट हो गई! ✅', 'success'); }; 
      return ( 
        <div className="app-wrapper bg-slate-900 text-white p-4 flex flex-col">
          <div className="flex items-center mb-6"><button onClick={onBack} className="mr-4 text-yellow-400 text-2xl">←</button><h2 className="text-xl font-bold">प्रोफाइल एडिट करें</h2></div>
          <div className="flex justify-center mb-6"><div className="w-24 h-24 rounded-full bg-slate-800 border-4 border-yellow-500 flex items-center justify-center text-5xl shadow-lg">{avatar}</div></div>
          <div className="bg-slate-800 p-4 rounded-xl mb-4 border border-white/5 space-y-3">
            <div><label className="text-xs text-gray-400">नाम</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-transparent text-white text-lg font-bold outline-none mt-1" /></div>
            <div><label className="text-xs text-gray-400">मोबाइल नंबर</label><div className="text-white text-lg font-bold mt-1">{user.mobile}</div></div>
            <div><label className="text-xs text-gray-400">पासवर्ड बदलें</label><input type="text" value={pass} onChange={(e) => setPass(e.target.value)} className="w-full bg-transparent text-white text-lg font-bold outline-none mt-1" /></div>
          </div>
          <div className="bg-slate-800 p-4 rounded-xl mb-6 border border-white/5">
            <div className="text-xs text-gray-400 mb-2">अवतार चुनें</div>
            <div className="flex flex-wrap gap-3">{avatars.map(av => <button key={av} onClick={() => setAvatar(av)} className={`w-12 h-12 rounded-full text-2xl flex items-center justify-center transition-transform ${avatar === av ? 'bg-yellow-500 scale-110' : 'bg-slate-900 active:scale-95'}`}>{av}</button>)}</div>
          </div>
          <button onClick={handleSave} className="w-full py-3 rounded-xl font-bold text-lg btn-primary mb-4">सेव करें</button>
          <button onClick={onLogout} className="w-full py-3 rounded-xl font-bold text-lg bg-red-600 text-white">लॉगआउट</button>
        </div> 
      ); 
    }
    
    // ============= GAME HISTORY SCREEN =============
    function GameHistoryScreen({ user, onBack }) { 
      const [filter, setFilter] = useState('all');
      
      const filteredHistory = (user.gameHistory || []).filter(g => {
        if (filter === 'teenpatti') return g.type === 'teenpatti';
        if (filter === 'mines') return g.type === 'mines';
        return true;
      });
      
      return ( 
        <div className="app-wrapper bg-slate-900 text-white p-4 flex flex-col">
          <div className="flex items-center mb-6"><button onClick={onBack} className="mr-4 text-yellow-400 text-2xl">←</button><h2 className="text-xl font-bold">गेम हिस्ट्री</h2></div>
          
          <div className="flex gap-2 mb-4 bg-slate-800 p-1 rounded-xl">
            <button onClick={() => setFilter('all')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${filter === 'all' ? 'bg-yellow-500 text-black' : 'text-gray-400'}`}>सभी</button>
            <button onClick={() => setFilter('teenpatti')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${filter === 'teenpatti' ? 'bg-green-600 text-white' : 'text-gray-400'}`}>🃏 तीन पत्ती</button>
            <button onClick={() => setFilter('mines')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${filter === 'mines' ? 'bg-purple-600 text-white' : 'text-gray-400'}`}>💣 Mines</button>
          </div>
          
          <div className="bg-slate-800 p-4 rounded-xl border border-white/5 flex-grow">
            <div className="space-y-2 max-h-[65vh] overflow-y-auto no-scrollbar">
              {filteredHistory.slice().reverse().map((g, i) => (
                <div key={i} className="bg-slate-900 p-3 rounded-lg flex justify-between items-center text-sm border border-white/5">
                  <div>
                    <div className="font-bold">{g.result}</div>
                    <div className="text-[10px] text-gray-500">{g.time}</div>
                    <div className="text-[8px] text-gray-600 mt-1">{g.type === 'teenpatti' ? '🃏 तीन पत्ती' : '💣 Mines'}</div>
                  </div>
                  <div className={`font-bold ${g.result === 'Loss' ? 'text-red-500' : 'text-green-500'}`}>
                    {g.result === 'Loss' ? '-' : '+'} ₹{g.amount}
                  </div>
                </div>
              ))}
              {filteredHistory.length === 0 && (
                <div className="text-gray-500 text-sm text-center py-4">कोई गेम हिस्ट्री नहीं मिली</div>
              )}
            </div>
          </div>
        </div> 
      ); 
    }
    
    // ============= REFERRAL SCREEN =============
    function ReferralScreen({ user, onBack }) { 
      const [referredUsers, setReferredUsers] = useState([]);

      useEffect(() => {
        const fetchReferrals = async () => {
          let allUsers = getUsers();
          if (window.db) {
            try {
              const snap = await window.db.ref('tp_users').once('value');
              allUsers = snap.val() || {};
            } catch(e) {}
          }
          const refs = Object.values(allUsers).filter(u => u.referredBy === user.referralCode);
          setReferredUsers(refs);
        };
        fetchReferrals();
      }, [user.referralCode]);

      const referralLink = `${window.location.origin}${window.location.pathname}?ref=${user.referralCode}`; 
      const copyToClipboard = () => { 
        navigator.clipboard.writeText(referralLink); 
        showColorfulToast('रेफरल लिंक कॉपी हो गया! 📋', 'success'); 
      }; 
      
      const shareText = `🃏 रॉयल कैसीनो में मेरे साथ खेलें और बोनस पाएं! 🎁\nयहाँ क्लिक करें: ${referralLink}`;
      const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;

      return ( 
        <div className="app-wrapper bg-slate-900 text-white p-4 flex flex-col">
          <div className="flex items-center mb-6"><button onClick={onBack} className="mr-4 text-yellow-400 text-2xl">←</button><h2 className="text-xl font-bold">रेफरल और कमाई</h2></div>
          <div className="bg-gradient-to-br from-purple-700 to-blue-700 p-6 rounded-2xl text-center mb-6 shadow-xl">
            <div className="text-5xl mb-2">🎁</div>
            <h3 className="font-bold text-xl mb-1">दोस्तों को निमंत्रण दें</h3>
            <p className="text-sm text-white/80 mb-4">हर सफल रेफरल पर ₹50 बोनस पाएं! (दोस्त के ₹100 डिपॉजिट करने पर)</p>
            <div className="bg-black/30 p-4 rounded-xl mb-4"><div className="text-xs text-white/60 mb-1">आपका रेफरल लिंक</div><div className="text-sm font-mono font-bold text-yellow-400 tracking-wide break-all px-2">{referralLink}</div></div>
            <a href={whatsappUrl} target="_blank" className="w-full py-3 bg-green-500 text-white font-bold rounded-xl active:scale-95 flex items-center justify-center gap-2 mb-3">
              <span className="text-xl">💬</span> व्हाट्सएप पर शेयर करें
            </a>
            <button onClick={copyToClipboard} className="w-full py-3 bg-white text-purple-700 font-bold rounded-xl active:scale-95">लिंक कॉपी करें</button>
          </div>
          <div className="bg-slate-800 p-4 rounded-xl mb-4 text-sm border border-white/5"><div className="flex justify-between border-b border-white/10 pb-2 mb-2"><span>आपकी यूनिक आईडी:</span><span className="font-mono text-yellow-500">{user.id}</span></div><div className="flex justify-between border-b border-white/10 pb-2 mb-2"><span>रेफरल कोड:</span><span className="font-mono text-yellow-500">{user.referralCode}</span></div><div className="flex justify-between"><span>कुल रेफरल कमाई:</span><span className="font-bold text-green-500">₹{user.referralEarnings || 0}</span></div></div>
          
          <div className="bg-slate-800 p-4 rounded-xl mb-4 flex-grow">
            <h3 className="font-bold text-yellow-400 mb-3">👥 मेरे रेफरल्स:</h3>
            <div className="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
              {referredUsers.length > 0 ? referredUsers.map((u, i) => {
                const totalDep = (u.depositHistory || []).reduce((sum, d) => {
                  if (d.status === 'Success' && d.desc !== 'Signup Bonus' && d.desc !== 'Promo Code') return sum + (parseInt(d.amount) || 0);
                  return sum;
                }, 0);
                const hasDeposited = totalDep >= 100;

                return (
                  <div key={i} className="bg-slate-900 p-3 rounded-lg flex justify-between items-center text-sm border border-white/5">
                    <div>
                      <div className="font-bold text-white">{u.name}</div>
                      <div className="text-[10px] text-gray-500">{u.mobile}</div>
                    </div>
                    <div className={`text-[10px] px-2 py-1 rounded ${hasDeposited ? 'bg-green-600 text-white' : 'bg-yellow-500 text-black'}`}>
                      {hasDeposited ? '✅ ₹100 डिपॉजिट हो गया' : '⏳ ₹100 डिपॉजिट बाकी'}
                    </div>
                  </div>
                );
              }) : <div className="text-gray-500 text-sm text-center py-4">अभी तक कोई रेफरल नहीं हुआ है।</div>}
            </div>
          </div>
        </div>
      );
    }

    // ============= RENDER =============
    if (typeof ReactDOM !== 'undefined' && ReactDOM.createRoot) {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } else {
      document.getElementById('root').innerHTML = '<div style="color:white;text-align:center;padding:50px;font-family:sans-serif;">गेम लोड होने में समस्या आ रही है। कृपया अपना इंटरनेट कनेक्शन जांचें या पेज रीफ्रेश करें।</div>';
    }
  </script>
</body>
</html>
